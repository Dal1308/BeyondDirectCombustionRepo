[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-fuel-heating-benchmark"
version = "1.1.0"
description = "Public reproducibility package for a thermodynamic benchmark of heat delivery from chemical fuels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Nidal Boorany" },
  { name = "Neil Thomas Stacey" },
  { name = "Diane Hildebrandt" },
  { name = "David Glasser" },
]
dependencies = [
  "cairosvg",
  "numpy",
  "pandas",
  "pillow",
  "pypdf",
  "pyyaml",
  "coolprop",
  "pytest",
  "matplotlib",
  "scipy",
]

[project.urls]
Repository = "https://github.com/Dal1308/BeyondDirectCombustionRepo"
Archive = "https://doi.org/10.5281/zenodo.20324897"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*"]
